<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>采购许可 · 服务器状态</title>
  <style nonce="__CSP_NONCE__">
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#152b3e;background:#f2f5f8}*{box-sizing:border-box}body{margin:0;padding:36px 20px}main{max-width:860px;margin:auto}h1{font-size:28px;margin:0 0 10px}p{line-height:1.7;color:#536678}.card{background:white;border:1px solid #d7e0e8;border-radius:12px;padding:22px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}dt{font-size:14px;color:#627385;margin-bottom:8px}dd{margin:0;font-size:20px;line-height:1.5}.count{font-size:46px;font-weight:700}#notice{min-height:28px}footer{font-size:13px;color:#627385;line-height:1.7}@media(max-width:540px){.grid{grid-template-columns:1fr}body{padding:24px 14px}h1{font-size:24px}}
  </style>
</head>
<body>
<main>
  <h1>服务器独立运行</h1>
  <p>采购供应 · 采购管理<br>满 10/10 自动清理 · 每 60 秒检测</p>
  <section class="card" aria-label="当前运行状态">
    <dl class="grid">
      <div><dt>当前占用</dt><dd class="count" id="used">— / 10</dd></div>
      <div><dt>常驻自动清理</dt><dd id="enabled">正在读取…</dd></div>
      <div><dt>本轮状态</dt><dd id="state">正在读取…</dd></div>
      <div><dt>最后检查</dt><dd id="checked-at">—</dd></div>
    </dl>
    <p id="notice" role="status" aria-live="polite">正在读取服务器状态…</p>
  </section>
  <section class="card" aria-label="最近一次真实测试">
    <h2>最近一次真实测试</h2>
    <p id="test-result">正在读取…</p><p id="test-time"></p>
  </section>
  <footer>本页只读，每 15 秒刷新。关闭本机窗口不影响服务器检测。<br>状态过期或读取失败时不代表占用为零。</footer>
</main>
<script nonce="__CSP_NONCE__">
  const labels = {checking:'正在检测',observing:'未满，继续监控',preview:'仅预览',released:'清理完成并已核验',cooldown:'清理后冷却中',changed_retry_next_cycle:'读数变化，下一轮重查',paused:'已暂停，需核对',stopped:'已停止',unavailable:'暂时无法读取'};
  const element = id => document.getElementById(id);
  const time = value => Number.isSafeInteger(value) ? new Date(value).toLocaleString('zh-CN', {hour12:false}) : '—';
  let loading = false;
  async function refresh() {
    if (loading) return;
    loading = true;
    const abort = new AbortController();
    const timeout = setTimeout(() => abort.abort(), 10_000);
    try {
      const response = await fetch('/status', {cache:'no-store',credentials:'omit',signal:abort.signal});
      if (!response.ok) throw new Error();
      const data = await response.json();
      const monitor = data.monitor;
      const stale = !Number.isSafeInteger(monitor.checkedAt) || Date.now() - monitor.checkedAt > 150_000;
      const paused = ['paused','stopped','unavailable'].includes(monitor.status);
      const current = monitor.status === 'released' ? monitor.after : monitor.used;
      element('used').textContent = !stale && !paused && Number.isSafeInteger(current) ? `${current} / 10` : '— / 10';
      element('enabled').textContent = stale ? '待确认' : paused ? '已暂停或停止' : monitor.enabled ? '已启用' : '未启用';
      element('state').textContent = labels[monitor.status] || labels.unavailable;
      element('checked-at').textContent = time(monitor.checkedAt);
      element('notice').textContent = stale ? '状态已过期或尚未取得，请等待检测或检查服务器。' : paused ? '自动清理已暂停，请核对服务器状态。' : '服务器持续检测中，无需保持此窗口开启。';
      const result = data.test;
      element('test-result').textContent = result?.status === 'verified' ? `${result.before} → ${result.after} 人；已释放 ${result.released} 人并核验成功。` : result?.status === 'pending' ? '测试结果待核对，不能重复发送清理。' : result === null ? '尚无测试记录。' : '测试记录暂时无法读取。';
      element('test-time').textContent = result?.checkedAt === undefined ? '' : `测试时间：${time(result.checkedAt)}`;
    } catch {
      element('used').textContent = '— / 10';
      element('enabled').textContent = '待确认';
      element('state').textContent = '状态页连接中断';
      element('notice').textContent = '当前无法读取；本机连接中断不等于服务器已停止。';
    } finally { clearTimeout(timeout); loading = false; }
  }
  void refresh();
  setInterval(() => { void refresh(); }, 15_000);
</script>
</body>
</html>
